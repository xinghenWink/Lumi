openapi: 3.1.0
info:
  title: Lumi API
  version: 0.4.0
  description: >-
    Accounts, credits, upstream configuration and owner-isolated chat. Mutations require Origin and
    X-Lumi-CSRF: 1. Chat POST streams use meta, delta, error, done and ping SSE events. Reuse request_id
    only with identical input; a live duplicate returns CHAT_BUSY. No image task execution yet.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Check process liveness without contacting dependencies
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: getReadiness
      summary: Check PostgreSQL and Redis connectivity
      responses:
        '200':
          description: Dependencies are ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: A dependency is unavailable or unconfigured
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/version:
    get:
      operationId: getVersion
      summary: Return build metadata
      responses:
        '200':
          description: Build version
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /api/v1/public/config:
    get:
      operationId: getPublicConfig
      summary: getPublicConfig
      parameters: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: login
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/auth/register:
    post:
      operationId: register
      summary: register
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/auth/send-code:
    post:
      operationId: sendVerificationCode
      summary: sendVerificationCode
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeInput'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: refreshSession
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        default:
          $ref: '#/components/responses/APIError'
      security:
        - refreshCookie: []
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: logout
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/me:
    get:
      operationId: getMe
      summary: getMe
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/APIError'
    patch:
      operationId: updateMe
      summary: updateMe
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSelfInput'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/me/password:
    post:
      operationId: changePassword
      summary: changePassword
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordInput'
      responses:
        '204':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 254
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum:
              - user
              - admin
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - disabled
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - created_at
              - last_login_at
              - balance
        - name: min_balance
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2000000000000
        - name: max_balance
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2000000000000
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        default:
          $ref: '#/components/responses/APIError'
    post:
      operationId: createUser
      summary: createUser
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
      responses:
        '201':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/admin/users/{id}:
    get:
      operationId: getUserDetail
      summary: getUserDetail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        default:
          $ref: '#/components/responses/APIError'
    patch:
      operationId: updateUser
      summary: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/APIError'
    delete:
      operationId: deleteUser
      summary: deleteUser
      description: >-
        Soft-delete the account after email confirmation and immediately revoke its sessions. An internal
        maintenance task permanently removes accounts after 30 days, cascades their sessions, and
        preserves audit history in the same transaction.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserInput'
      responses:
        '204':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/admin/settings/{group}:
    get:
      operationId: getSettings
      summary: getSettings
      security:
        - bearerAuth: []
      parameters:
        - name: group
          in: path
          required: true
          schema:
            type: string
            enum:
              - site
              - registration
              - mail
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsView'
        default:
          $ref: '#/components/responses/APIError'
    put:
      operationId: saveSettings
      summary: saveSettings
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
        - name: group
          in: path
          required: true
          schema:
            type: string
            enum:
              - site
              - registration
              - mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsView'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/admin/audit-logs:
    get:
      operationId: listAuditLogs
      summary: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: target_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: target_type
          in: query
          required: false
          schema:
            type: string
            maxLength: 30
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/me/credits:
    get:
      operationId: getMyCredits
      summary: Read balances and atomically apply the daily lazy reset
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccount'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/me/credits/ledger:
    get:
      operationId: listMyCreditLedger
      summary: listMyCreditLedger
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - signup_bonus
              - daily_grant
              - daily_expire
              - redeem
              - admin_adjust
              - image_charge
              - image_refund
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditLedgerPage'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/me/credits/stats:
    get:
      operationId: getMyCreditUsage
      summary: >-
        30 calendar days and current month in the configured credits timezone; image counts include
        settled successes only
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditUsage'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/me/credits/quote:
    post:
      operationId: quoteCredits
      summary: quoteCredits
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditQuote'
        default:
          $ref: '#/components/responses/APIError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditQuoteInput'
  /api/v1/me/redeem:
    post:
      operationId: redeemCredits
      summary: >-
        Redeem once per person; at most five attempts per minute and a one-hour cooldown after ten
        consecutive failures
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: ^[A-Za-z0-9_.:-]+$
            description: >-
              Scoped to actor and request. Exact replays return the original result; changed payload or
              operation returns IDEMPOTENCY_CONFLICT.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemResult'
        default:
          $ref: '#/components/responses/APIError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemInput'
  /api/v1/me/redeem-records:
    get:
      operationId: listMyRedemptions
      summary: listMyRedemptions
      security:
        - bearerAuth: []
      parameters:
        - name: code_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemRecordPage'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/admin/users/{id}/credits:
    get:
      operationId: getUserCredits
      summary: getUserCredits
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccount'
        default:
          $ref: '#/components/responses/APIError'
    post:
      operationId: adjustUserCredits
      summary: adjustUserCredits
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: ^[A-Za-z0-9_.:-]+$
            description: >-
              Scoped to actor and request. Exact replays return the original result; changed payload or
              operation returns IDEMPOTENCY_CONFLICT.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccount'
        default:
          $ref: '#/components/responses/APIError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditAdjustInput'
  /api/v1/admin/pricing:
    get:
      operationId: getCreditPricing
      summary: getCreditPricing
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditPricing'
        default:
          $ref: '#/components/responses/APIError'
    put:
      operationId: saveCreditPricing
      summary: >-
        Atomically replace global/model rules and gift configuration; requires all six global
        operation/quality rules
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditPricing'
        default:
