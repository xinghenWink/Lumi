          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        default:
          $ref: '#/components/responses/APIError'
    patch:
      operationId: updateUser
      summary: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/APIError'
    delete:
      operationId: deleteUser
      summary: deleteUser
      description: >-
        Soft-delete the account after email confirmation and immediately revoke its sessions. An internal
        maintenance task permanently removes accounts after 30 days, cascades their sessions, and
        preserves audit history in the same transaction.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserInput'
      responses:
        '204':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/admin/settings/{group}:
    get:
      operationId: getSettings
      summary: getSettings
      security:
        - bearerAuth: []
      parameters:
        - name: group
          in: path
          required: true
          schema:
            type: string
            enum:
              - site
              - registration
              - mail
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsView'
        default:
          $ref: '#/components/responses/APIError'
    put:
      operationId: saveSettings
      summary: saveSettings
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
        - name: group
          in: path
          required: true
          schema:
            type: string
            enum:
              - site
              - registration
              - mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
