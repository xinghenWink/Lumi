  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 254
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum:
              - user
              - admin
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - disabled
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - created_at
              - last_login_at
              - balance
        - name: min_balance
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2000000000000
        - name: max_balance
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 2000000000000
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        default:
          $ref: '#/components/responses/APIError'
    post:
      operationId: createUser
      summary: createUser
      security:
        - bearerAuth: []
