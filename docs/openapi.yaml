  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: refreshSession
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
