          maxItems: 100
        action:
          type: string
          enum:
            - enable
            - disable
            - delete
            - grant
        amount:
          type: integer
          minimum: 0
        note:
          type: string
          maxLength: 200
        confirm:
          type: boolean
      required:
        - ids
        - action
