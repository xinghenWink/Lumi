openapi: 3.1.0
info:
  title: Lumi API
  version: 0.6.0
  description: >-
    Accounts, credits, upstream configuration and owner-isolated chat. Mutations require Origin and
    X-Lumi-CSRF: 1. Chat POST streams use meta, delta, error, done and ping SSE events. Reuse request_id
    only with identical input; live duplicates replay the owner-scoped Redis stream (five-minute TTL). Image tasks charge and settle atomically, run independently of HTTP, and expose only owner-scoped signed files.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Check process liveness without contacting dependencies
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: getReadiness
      summary: Check PostgreSQL and Redis connectivity
      responses:
        '200':
          description: Dependencies are ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: A dependency is unavailable or unconfigured
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/version:
    get:
      operationId: getVersion
      summary: Return build metadata
      responses:
        '200':
          description: Build version
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /api/v1/public/config:
    get:
      operationId: getPublicConfig
      summary: getPublicConfig
      parameters: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: login
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
          required: false
          schema:
            type: string
        - name: Referer
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/auth/register:
    post:
      operationId: register
      summary: register
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            enum:
              - '1'
        - name: Origin
          in: header
