              schema:
                $ref: '#/components/schemas/SettingsView'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/admin/audit-logs:
    get:
      operationId: listAuditLogs
      summary: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: target_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: target_type
          in: query
          required: false
          schema:
            type: string
            maxLength: 30
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/me/credits:
    get:
      operationId: getMyCredits
      summary: Read balances and atomically apply the daily lazy reset
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccount'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/me/credits/ledger:
    get:
      operationId: listMyCreditLedger
      summary: listMyCreditLedger
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - signup_bonus
              - daily_grant
              - daily_expire
              - redeem
              - admin_adjust
              - image_charge
              - image_refund
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditLedgerPage'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/me/credits/stats:
    get:
      operationId: getMyCreditUsage
      summary: >-
        30 calendar days and current month in the configured credits timezone; image counts include
        settled successes only
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditUsage'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/me/credits/quote:
    post:
      operationId: quoteCredits
      summary: quoteCredits
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditQuote'
        default:
          $ref: '#/components/responses/APIError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditQuoteInput'
  /api/v1/me/redeem:
    post:
      operationId: redeemCredits
      summary: >-
        Redeem once per person; at most five attempts per minute and a one-hour cooldown after ten
        consecutive failures
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: ^[A-Za-z0-9_.:-]+$
            description: >-
              Scoped to actor and request. Exact replays return the original result; changed payload or
              operation returns IDEMPOTENCY_CONFLICT.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemResult'
        default:
          $ref: '#/components/responses/APIError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemInput'
  /api/v1/me/redeem-records:
    get:
      operationId: listMyRedemptions
      summary: listMyRedemptions
      security:
        - bearerAuth: []
      parameters:
        - name: code_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemRecordPage'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/admin/users/{id}/credits:
    get:
      operationId: getUserCredits
      summary: getUserCredits
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccount'
        default:
          $ref: '#/components/responses/APIError'
    post:
      operationId: adjustUserCredits
      summary: adjustUserCredits
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: ^[A-Za-z0-9_.:-]+$
            description: >-
              Scoped to actor and request. Exact replays return the original result; changed payload or
              operation returns IDEMPOTENCY_CONFLICT.
      responses:
        '200':
          description: Success
