components:
  headers:
    RequestID:
      description: Server-generated request identifier
      schema:
        type: string
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Readiness:
      type: object
      additionalProperties: false
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
        checks:
          type: object
          additionalProperties: false
          required:
            - postgres
            - redis
          properties:
            postgres:
              type: string
              enum:
                - ok
            redis:
              type: string
              enum:
                - ok
    Version:
      type: object
      additionalProperties: false
      required:
        - version
        - commit
        - build_time
      properties:
        version:
          type: string
