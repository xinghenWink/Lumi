        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/APIError'
    delete:
      summary: /api/v1/me
      operationId: m6_delete__api_v1_me
      security:
        - bearerAuth: []
      parameters:
        - name: X-Lumi-CSRF
          in: header
          required: true
          schema:
            type: string
            const: '1'
      responses:
        '204':
          description: Completed
        '400':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteOwnAccountInput'
  /api/v1/me/password:
    post:
      operationId: changePassword
      summary: changePassword
