  /api/v1/me:
    get:
      operationId: getMe
      summary: getMe
      security:
        - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/APIError'
    patch:
      operationId: updateMe
      summary: updateMe
      security:
