function ensureDemoIdentity(){

  const previousRole=state.user.role==='admin'?'admin':'user',existing=captureDemoProfile(),sample=captureDemoProfile(seed());

function resetDay(){if(state.accounts.lastReset===today())return;const prev=state.accounts.daily;if(prev>0)state.ledger.unshift({id:rand(),type:'daily_expire',amount:-prev,bucket:'daily',note:'昨日剩余清零',at:now()});state.accounts.daily=Number(state.settings.daily)||0;state.accounts.lastReset=today();if(state.accounts.daily)state.ledger.unshift({id:rand(),type:'daily_grant',amount:state.accounts.daily,bucket:'daily',note:'每日赠送',at:now()});syncUser();persist()}

function ledger(type,amt,bucket,note){state.ledger.unshift({id:rand(),type,amount:amt,bucket,note,at:now()});syncUser()}

function renderEmpty(){return `<div class="empty-center"><div class="hero-logo">${ico(state.mode==='chat'?'spark':'image')}</div><h1 class="hero-title">${state.mode==='chat'?'灵感，从一次对话开始。':'把想象，变成画面。'}</h1><p class="hero-sub">${state.mode==='chat'?'写作、学习、编程，随时开始交流。':'用文字描述灵感，也可以上传图片继续创作。'}</p><div class="suggestions">${IDEAS[state.mode].map(([title,txt,icon])=>`<button class="suggestion" data-action="suggest" data-text="${safe(txt)}">${ico(icon)}<span><b>${safe(title)}</b><small>${safe(txt)}</small></span></button>`).join('')}</div></div>`}
function renderMessageText(text){const lines=safe(text).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`\n]+)`/g,'<code style="background:var(--panel2);padding:2px 5px;border-radius:4px">$1</code>');return lines}
function renderMessages(c){return c.messages.map((msg,index)=>{if(msg.role==='user'){const refs=msg.refs||[];return `<div class="message-row user">${refs.length?`<div class="bubble-ref">${refs.map(id=>{const im=state.images.find(x=>x.id===id);return im?`<img src="${artURL(im)}" alt="参考图">`:''}).join('')}</div>`:''}<div class="user-bubble">${safe(msg.text)}${msg.params?`<div class="user-params">${[qLabels[msg.params.quality],msg.params.ratio,msg.params.size,msg.params.n+' 张',msg.params.edit?'参考图编辑':null].filter(Boolean).map(t=>`<span class="param-tag">${safe(t)}</span>`).join('')}</div>`:''}</div><div class="message-tools"><button class="text-action" data-action="edit-user-msg" data-index="${index}" title="编辑并重新发送">编辑并重发</button></div></div>`}
const image=(msg.imageIds||[]).map(id=>state.images.find(x=>x.id===id)).filter(Boolean);return `<div class="message-row assistant"><div class="assistant-row"><div class="assistant-mark">${ico('spark','mini-icon')}</div><div class="assistant-content">${msg.text?renderMessageText(msg.text):''}${msg.status==='pending'?`<div class="muted small" style="margin:7px 0">${ico('clock','mini-icon')} 正在准备创作…</div><div class="loading-grid">${Array.from({length:msg.n||1},()=>'<div class="image-skel"></div>').join('')}</div>`:''}${image.length?`<div class="image-grid">${image.map(im=>cardImage(im)).join('')}</div>`:''}${msg.imageIds?`<div class="result-foot"><span class="status ${msg.status==='succeeded'?'green':msg.status==='failed'?'red':''}">${msg.status==='succeeded'?'已完成':msg.status==='failed'?'已取消':'进行中'}</span><span>消耗 ${msg.cost||0} 积分</span>${image.length?`<button class="text-action" data-action="regen" data-index="${index}">按相同参数再生成</button>`:''}${msg.status==='pending'?`<button class="text-action" data-action="cancel-task" data-id="${msg.taskId}">取消任务</button>`:''}</div>`:''}</div></div>${msg.text?`<div class="message-tools" style="margin-left:39px"><button class="icon-btn" data-action="copy-msg" data-index="${index}" title="复制内容">${ico('copy')}</button><button class="icon-btn" data-action="regen" data-index="${index}" title="重新生成">${ico('refresh')}</button></div>`:''}</div>`}).join('')}
function renderComposer(){const m=state.mode,p=state.imagePrefs,balance=creditTotal(),cost=imageCost(),insuf=m==='create'&&cost>balance,pending=!!ui.activeStream;return `<div class="composer-zone"><div class="composer-inner"><div class="composer"><div class="attachments" id="attach-preview">${ui.pendingRefs.map((x,i)=>`<div class="attachment"><img src="${x.url}" alt="参考图片 ${i+1}"><span class="small truncate">${safe(x.name||'参考图')}</span><button data-action="remove-ref" data-index="${i}" aria-label="移除参考图片">${ico('close')}</button></div>`).join('')}</div><textarea id="prompt" rows="2" placeholder="${m==='chat'?'给 Lumi 发送消息…':'描述你想生成的画面，也可以上传参考图进行编辑…'}" aria-label="输入提示词">${safe(state.drafts[m]||'')}</textarea><div class="composer-toolbar"><div class="header-popup-anchor"><button class="icon-btn" data-action="attach-toggle" aria-label="添加图片" title="添加图片">${ico('plus')}</button>${ui.attachOpen?`<div class="popover utility-pop"><button class="menu-option" data-action="upload">${ico('up')} 上传本地图片</button><button class="menu-option" data-action="picker">${ico('grid')} 从图库选择</button></div>`:''}</div>${m==='create'?`<div class="header-popup-anchor"><button class="param-open" data-action="param-toggle" aria-expanded="${ui.paramOpen}">${ico('sliders','mini-icon')} ${qLabels[p.quality]} · ${p.ratio} · ${p.n} 张 ${ico('chevron','mini-icon')}</button>${ui.paramOpen?renderParamPop():''}</div>`:''}<div class="grow"></div><div class="header-popup-anchor composer-model-anchor"><button class="model-select composer-model-select" data-action="model-toggle" aria-haspopup="listbox" aria-label="切换${m==='chat'?'聊天':'生图'}模型" aria-expanded="${ui.modelOpen}" title="当前模型：${safe(currentModel().name)}"><span class="truncate">${safe(currentModel().name)}</span>${ico('chevron','mini-icon')}</button>${ui.modelOpen?`<div class="popover model-pop" role="listbox" aria-label="${m==='chat'?'聊天':'生图'}模型列表"><div class="eyebrow" style="padding:10px 10px 5px">选择${m==='chat'?'聊天':'生图'}模型</div>${MODELS[m].map(x=>`<button class="model-option ${state.models[m]===x.id?'active':''}" role="option" aria-selected="${state.models[m]===x.id}" data-action="model-set" data-id="${x.id}">${ico(x.id===state.models[m]?'check':m==='chat'?'msg':'image')}<span class="grow"><strong>${safe(x.name)}</strong><span>${safe(x.desc)}</span></span></button>`).join('')}</div>`:''}</div>${pending?`<button class="icon-btn primary" data-action="stop" title="停止生成">${ico('stop')}</button>`:`<button class="icon-btn primary" data-action="send" title="${insuf?'积分不足':'发送'}" ${insuf?'disabled':''}>${ico('send')}</button>`}</div></div>${m==='create'?`<div class="cost-line ${insuf?'error':''}">本次预计消耗 <strong>${cost}</strong> 积分 <span>·</span> 每日 ${state.accounts.daily} + 永久 ${state.accounts.permanent} ${insuf?`<span>积分不足，<button class="table-action" data-action="nav-credits">去兑换</button></span>`:''}</div>`:''}<div class="composer-caption">演示原型 · AI 回复与图像均为模拟结果，尚未连接真实 API</div></div></div>`}
function renderParamPop(){const p=state.imagePrefs;return `<div class="popover param-pop"><div class="flex" style="justify-content:space-between"><b>图像创作设置</b><span class="badge-demo">根据模型能力配置</span></div><div><div class="field-head"><span>画质</span><span class="muted">每张消耗的积分</span></div><div class="choice-grid">${['low','medium','high'].map(k=>`<button class="choice ${p.quality===k?'active':''}" data-action="param" data-key="quality" data-value="${k}">${qLabels[k]} · ${state.settings.prices[k]}</button>`).join('')}</div></div><div><div class="field-head"><span>画幅比例</span><span class="muted">输出尺寸自动匹配</span></div><div class="choice-grid">${RATIOS.map(k=>`<button class="choice ${p.ratio===k?'active':''}" data-action="param" data-key="ratio" data-value="${k}">${k==='auto'?'自动':k}</button>`).join('')}</div><div class="size-note" style="margin-top:9px">当前映射尺寸：${SIZES[p.ratio]}。最终支持项以 chatgpt2api 实测为准。</div></div><div><div class="field-head"><span>生成数量</span><span class="muted">单次最多 ${state.settings.maxN} 张</span></div><div class="choice-grid">${[1,2,3,4].map(k=>`<button class="choice ${p.n===k?'active':''}" data-action="param" data-key="n" data-value="${k}" ${k>state.settings.maxN?'disabled':''}>${k} 张</button>`).join('')}</div></div><div class="divider"></div><div class="flex"><div class="grow"><b>${imageCost()} 积分</b><div class="small muted">${ui.pendingRefs.length?'参考图编辑':'文生图'} · 费用预估</div></div><button class="btn sm" data-action="param-close">完成 ${ico('check','mini-icon')}</button></div></div>`}
function profileShell(){const s=state.settings,a=state.accounts,tab=ui.meTab;return `<div class="view page"><header class="page-header"><button class="icon-btn" data-action="back-work" title="返回创作空间">${ico('arrow')}</button><div class="grow"><h1>个人中心</h1><div class="muted small">管理账号、积分与历史内容</div></div><button class="btn" data-action="settings-modal">${ico('settings','mini-icon')} 偏好设置</button></header><div class="page-wrap section-stack"><div class="card profile-card"><span class="avatar large">${safe(state.user.name[0])}</span><div class="grow"><div class="strong" style="font-size:17px">${safe(state.user.name)}</div><div class="muted small">${safe(state.user.email)} · 加入于 ${safe(state.user.joined||'2026-10-21')}</div></div><button class="btn sm" data-action="profile-edit">编辑资料</button></div><div class="stat-grid"><div class="card stat-card"><div class="muted small">当前可用积分</div><div class="stat-num">${creditTotal()}</div><div class="stat-sub">每日赠送 + 永久余额</div></div><div class="card stat-card"><div class="muted small">今日赠送余额</div><div class="stat-num">${a.daily}<span class="small muted"> / ${s.daily}</span></div><div class="stat-sub">次日 00:00 重置，不累计</div></div><div class="card stat-card"><div class="muted small">永久积分</div><div class="stat-num">${a.permanent}</div><div class="stat-sub">注册、兑换码、管理员调整</div></div><div class="card stat-card"><div class="muted small">我的生图作品</div><div class="stat-num">${state.images.length}</div><div class="stat-sub">可继续用作参考图编辑</div></div></div><div class="tabs" style="margin:10px 0 0">${[['credits','积分与流水'],['images','生图历史'],['chats','会话管理'],['prefs','偏好与安全']].map(([v,t])=>`<button class="tab ${tab===v?'active':''}" data-action="me-tab" data-value="${v}">${t}</button>`).join('')}</div>${tab==='credits'?renderCreditsPage():tab==='images'?renderGalleryPage():tab==='chats'?renderChatHistory():renderPrefPage()}</div></div>`}
function ledgerName(t){return{signup_bonus:'注册赠送',daily_grant:'每日赠送',daily_expire:'每日清零',image_charge:'生图消耗',image_refund:'生图退款',redeem:'兑换码',admin_adjust:'后台调整'}[t]||t}
function renderCreditsPage(){const last=state.ledger.filter(x=>x.type==='image_charge').slice(0,7);const nums=last.length?last.map(x=>Math.abs(x.amount)):[4,9,5,12,7,10,6];const max=Math.max(...nums,1);return `<div class="two-cols"><div class="section-stack"><div class="card"><div class="section-title"><h3>积分流水</h3><span class="small muted">完整记录 · 最新在前</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>时间</th><th>类型</th><th>来源</th><th>变动</th><th>说明</th></tr></thead><tbody>${state.ledger.map(x=>`<tr><td>${fmt(x.at)}</td><td>${ledgerName(x.type)}</td><td>${x.bucket==='daily'?'每日':'永久'}</td><td style="color:var(--${x.amount>=0?'green':'red'})">${x.amount>0?'+':''}${x.amount}</td><td>${safe(x.note)}</td></tr>`).join('')||'<tr><td colspan="5">暂无记录</td></tr>'}</tbody></table></div></div><div class="card"><div class="section-title"><h3>最近消耗趋势</h3><span class="small muted">演示记录分布</span></div><div class="mini-bars-wrap"><div class="mini-bars">${nums.map((v,i)=>`<div class="mini-bar" style="height:${Math.max(7,v/max*100)}%" data-label="${i+1}"></div>`).join('')}</div></div><div class="muted small">展示原型中的积分消耗样例，正式版按近 30 天实际数据按日统计。</div></div></div><div class="section-stack"><div class="redeem-banner"><h3 style="margin:0 0 7px">${ico('gift','mini-icon')} 兑换积分</h3><p class="small" style="margin:0 0 13px">输入兑换码，积分将添加至永久余额，不受每日重置影响。</p><form data-form="redeem" class="form-row"><input name="code" required placeholder="例如 LUMI-DEMO-2026" aria-label="兑换码"><button class="btn primary" type="submit">立即兑换</button></form><div class="small muted" style="margin-top:11px">体验码：LUMI-DEMO-2026（50 积分，每码限用一次）</div></div><div class="card"><h3>积分使用规则</h3><div class="small muted" style="line-height:2.1">聊天目前免费，不消耗积分。<br>生图先使用每日赠送积分，不足部分使用永久积分。<br>任务失败会自动退回扣除的积分。<br>具体单价以创作页实时展示为准。</div></div></div></div>`}
function galleryContent(images){return images.length?`<div class="gallery">${images.map(img=>`<div class="gallery-item"><img src="${artURL(img)}" alt="${safe(img.prompt)}" data-action="preview" data-id="${img.id}" loading="lazy"><div class="gallery-bottom"><div class="truncate strong small" title="${safe(img.prompt)}">${safe(img.prompt)}</div><div class="muted tiny">${qLabels[img.quality]} · ${img.ratio} · ${fmt(img.created)}</div><div class="flex" style="margin-top:10px"><button class="btn sm light" data-action="edit-image" data-id="${img.id}">${ico('edit','mini-icon')} 加入编辑</button><button class="icon-btn" data-action="download-image" data-id="${img.id}" title="下载">${ico('download','mini-icon')}</button><button class="icon-btn" data-action="delete-image" data-id="${img.id}" title="删除">${ico('trash','mini-icon')}</button></div></div></div>`).join('')}</div>`:'<div class="blank-panel">没有符合条件的图片，试试调整筛选条件。</div>'}
function renderGalleryPage(){const imgs=state.images.filter(x=>(ui.galleryFilter==='all'||x.quality===ui.galleryFilter)&&x.prompt.toLowerCase().includes(ui.gallerySearch.toLowerCase())).sort((a,b)=>new Date(b.created)-new Date(a.created));return `<div class="card"><div class="section-title"><h3>全部作品 <span class="muted small">${imgs.length} 张</span></h3><button class="btn sm" data-action="new-create">${ico('plus','mini-icon')} 开始创作</button></div><div class="filterbar"><div class="searchbox">${ico('search')}<input id="gallery-search" placeholder="搜索图片提示词" value="${safe(ui.gallerySearch)}"></div><select id="gallery-filter" aria-label="按画质筛选"><option value="all" ${ui.galleryFilter==='all'?'selected':''}>全部画质</option>${['low','medium','high'].map(k=>`<option value="${k}" ${ui.galleryFilter===k?'selected':''}>${qLabels[k]}画质</option>`).join('')}</select></div>${galleryContent(imgs)}</div>`}
function renderChatHistory(){const c=state.conversations.filter(x=>x.mode==='chat');return `<div class="card"><div class="section-title"><h3>聊天会话</h3><button class="btn sm danger" data-action="clear-chats">${ico('trash','mini-icon')} 清空全部</button></div><div class="table-scroll"><table class="data-table"><thead><tr><th>会话标题</th><th>消息数</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${c.map(x=>`<tr><td>${ico('msg','mini-icon')} ${safe(x.title)}</td><td>${x.messages.length}</td><td>${fmt(x.created)}</td><td><button class="table-action" data-action="open-conv" data-id="${x.id}">打开</button><button class="table-action" data-action="rename-conv" data-id="${x.id}">重命名</button><button class="table-action danger" data-action="delete-conv" data-id="${x.id}">删除</button></td></tr>`).join('')||'<tr><td colspan="4">暂无聊天记录</td></tr>'}</tbody></table></div></div>`}
function renderPrefPage(){return `<div class="two-cols"><div class="card"><h3>常用偏好</h3><form data-form="preferences" class="section-stack"><label class="field">界面主题<select name="theme"><option value="light" ${state.theme==='light'?'selected':''}>浅色</option><option value="dark" ${state.theme==='dark'?'selected':''}>深色</option></select></label><label class="field">默认图像画质<select name="quality">${['low','medium','high'].map(q=>`<option value="${q}" ${state.imagePrefs.quality===q?'selected':''}>${qLabels[q]}</option>`).join('')}</select></label><label class="field">默认图像比例<select name="ratio">${RATIOS.map(r=>`<option value="${r}" ${state.imagePrefs.ratio===r?'selected':''}>${r}</option>`).join('')}</select></label><button class="btn primary" type="submit">保存偏好</button></form></div><div class="card"><h3>账号安全</h3><p class="small muted">此文件是离线交互原型，没有真实账号鉴权与服务器。正式上线需要后端会话、密码哈希和权限校验。</p><button class="btn" data-action="profile-edit">${ico('edit','mini-icon')} 修改演示昵称</button><div class="divider" style="margin:20px 0"></div>${demoRoleSwitcher()}<div class="small muted" style="margin-top:12px">Chrome · 当前演示设备</div><div style="margin-top:14px"><button class="btn danger" data-action="reset-demo">恢复出厂演示数据</button></div></div></div>`}
const ADMIN_TABS=[['overview','运营概览','chart'],['users','用户管理','users'],['credits','积分与定价','coins'],['redeem','兑换码管理','gift'],['upstream','上游与模型','link'],['tasks','生图任务','image'],['settings','系统设置','settings'],['audit','审计日志','shield']];
function adminShell(){const tab=ADMIN_TABS.find(x=>x[0]===ui.adminTab)||ADMIN_TABS[0];return `<div class="view page"><div class="veil ${ui.adminSide?'visible':''}" data-action="close-side"></div><div class="admin-shell"><aside class="admin-side ${ui.adminSide?'open':''}"><div class="admin-title"><div class="flex"><span class="logo">${ico('spark')}</span><div><span class="brand">Lumi</span><div class="brand-desc">ADMIN CONSOLE</div></div></div></div><div class="admin-nav-label">工作空间</div><button class="nav-btn" data-action="back-work">${ico('arrow')} 返回用户端</button><div class="admin-nav-label">平台运营</div>${ADMIN_TABS.map(([id,title,icon],i)=>`${i===4?'<div class="admin-nav-label">模型与系统</div>':''}<button class="nav-btn ${id===ui.adminTab?'active':''}" data-action="admin-tab" data-value="${id}">${ico(icon)} ${title}</button>`).join('')}<div class="admin-demo-footer">${demoRoleSwitcher()}<span class="badge-demo">${ico('shield','mini-icon')} 管理员演示</span><p class="tiny muted">这里的写入仅改变浏览器演示数据，不执行服务端操作。</p></div></aside><div class="admin-content"><header class="admin-top"><button class="icon-btn mobile-only" data-action="admin-mobile">${ico('menu')}</button><h1>${tab[1]}</h1><span class="grow"></span><span class="badge-demo">Prototype</span><button class="icon-btn" data-action="theme" title="切换主题">${ico(state.theme==='dark'?'sun':'moon')}</button><span class="avatar" style="width:31px;height:31px">${safe(state.user.name[0])}</span></header><div class="admin-body">${adminSection()}</div></div></div></div>`}

function adminCredits(){const s=state.settings;return `<div class="page-heading"><div><h2>积分与定价</h2><span class="muted small">统一维护前台生图价格与奖励规则</span></div></div><div class="two-cols"><div class="card"><h3>生图质量定价</h3><form data-form="pricing" class="section-stack"><div class="small muted">按张计费。编辑图片可设置独立倍率。</div>${['low','medium','high'].map(q=>`<label class="field">${qLabels[q]}质量（积分 / 张）<input name="price_${q}" type="number" min="0" max="9999" step="1" value="${s.prices[q]}"></label>`).join('')}<label class="field">改图倍率<input name="editMult" type="number" step="0.1" min="0.1" max="10" value="${s.editMult}"></label><button class="btn primary" type="submit">保存价格</button></form></div><div class="card"><h3>注册与每日赠送</h3><form data-form="bonus" class="section-stack"><label class="field">新用户注册赠送积分<input name="signup" type="number" min="0" max="100000" value="${s.signup}"></label><label class="field">每日生图赠送积分<input name="daily" type="number" min="0" max="100000" value="${s.daily}"></label><label class="field">每日重置时区<input value="Asia/Shanghai" readonly></label><div class="small muted">修改规则只影响新注册用户或下一次每日重置，不会覆盖当前余额。</div><button class="btn primary" type="submit">保存赠送规则</button></form></div></div><div class="card" style="margin-top:17px"><div class="section-title"><h3>全站积分流水（本地演示）</h3></div><div class="table-scroll"><table class="data-table"><thead><tr><th>时间</th><th>类型</th><th>桶</th><th>变动</th><th>备注</th></tr></thead><tbody>${state.ledger.slice(0,20).map(l=>`<tr><td>${fmt(l.at)}</td><td>${ledgerName(l.type)}</td><td>${l.bucket==='daily'?'每日':'永久'}</td><td style="color:var(--${l.amount>=0?'green':'red'})">${l.amount>0?'+':''}${l.amount}</td><td>${safe(l.note)}</td></tr>`).join('')}</tbody></table></div></div>`}
function adminRedeem(){const active=state.codes.filter(x=>x.status==='active'&&x.used<x.maxUses).length;return `<div class="page-heading"><div><h2>兑换码管理</h2><span class="muted small">生成、查询、禁用和导出兑换码</span></div><button class="btn" data-action="export-codes">${ico('download','mini-icon')} 导出 CSV</button></div><div class="stat-grid" style="margin-bottom:17px"><div class="card stat-card"><div class="muted small">兑换码总数</div><div class="stat-num">${state.codes.length}</div></div><div class="card stat-card"><div class="muted small">可使用</div><div class="stat-num">${active}</div></div><div class="card stat-card"><div class="muted small">已使用完</div><div class="stat-num">${state.codes.filter(x=>x.used>=x.maxUses).length}</div></div><div class="card stat-card"><div class="muted small">已禁用</div><div class="stat-num">${state.codes.filter(x=>x.status==='disabled').length}</div></div></div><div class="card" style="margin-bottom:17px"><h3>批量生成</h3><form data-form="generate-codes" class="form-grid"><label class="field">数量（1-100）<input name="count" type="number" min="1" max="100" value="5" required></label><label class="field">每码积分<input name="credits" type="number" min="1" value="20" required></label><label class="field">前缀（可选）<input name="prefix" value="LUMI" maxlength="10"></label><label class="field">批次名称<input name="batch" value="运营活动" maxlength="30"></label><label class="field">每码可用次数<input name="maxUses" type="number" min="1" max="100" value="1"></label><div class="field" style="align-self:end"><button class="btn primary" type="submit">${ico('plus','mini-icon')} 生成兑换码</button></div></form></div><div class="card"><div class="section-title"><h3>全部兑换码</h3><span class="muted small">单码每用户仅可兑换一次（生产环境由服务端保证）</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>兑换码</th><th>积分</th><th>已用/可用</th><th>批次</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.codes.map((c,i)=>`<tr><td><code>${safe(c.code)}</code></td><td>${c.credits}</td><td>${c.used}/${c.maxUses}</td><td>${safe(c.batch)}</td><td><span class="status ${c.status==='disabled'?'red':c.used>=c.maxUses?'':'green'}">${c.status==='disabled'?'禁用':c.used>=c.maxUses?'已使用':'可用'}</span></td><td><button class="table-action" data-action="copy-code" data-id="${i}">复制</button><button class="table-action ${c.status==='active'?'danger':''}" data-action="toggle-code" data-id="${i}">${c.status==='active'?'禁用':'启用'}</button></td></tr>`).join('')}</tbody></table></div></div>`}
function adminUpstream(){return `<div class="page-heading"><div><h2>上游与模型</h2><span class="muted small">平台模型映射到 chatgpt2api 的真实模型</span></div><button class="btn primary" data-action="upstream-info">${ico('plus','mini-icon')} 配置上游（说明）</button></div><div class="card" style="margin-bottom:17px"><div class="section-title"><h3>上游渠道</h3><span class="badge-demo">未接入真实服务</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>名称</th><th>基础 URL</th><th>连接状态</th><th>操作</th></tr></thead><tbody>${state.upstreams.map(x=>`<tr><td>${safe(x.name)}</td><td><code>${safe(x.url)}</code></td><td><span class="status">等待后端接入</span></td><td><button class="table-action" data-action="upstream-info">配置</button><button class="table-action" data-action="upstream-info">测试连接</button><button class="table-action" data-action="upstream-info">同步模型</button></td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="section-title"><h3>对用户展示的平台模型</h3><span class="muted small">下列名称仅用于原型预览</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>展示名称</th><th>类型</th><th>能力描述</th><th>原型状态</th></tr></thead><tbody>${Object.entries(MODELS).flatMap(([m,items])=>items.map(x=>`<tr><td>${safe(x.name)}</td><td>${m==='chat'?'对话':'生图/改图'}</td><td>${safe(x.desc)}</td><td><span class="status green">展示中</span></td></tr>`)).join('')}</tbody></table></div><p class="small muted">实际的「平台模型 → 渠道 → 上游模型」映射、密钥加密、模型同步、能力配置和健康检测必须由后端实现；此演示不会调用上游，也不接收真实 API Key。</p></div>`}
function renderTasksTable(tasks){return `<div class="table-scroll"><table class="data-table"><thead><tr><th>任务</th><th>用户</th><th>状态</th><th>张数</th><th>画质</th><th>积分</th><th>时间</th></tr></thead><tbody>${tasks.map(t=>`<tr><td><code>${safe(t.id.slice(0,8))}</code></td><td>${safe(t.user)}</td><td><span class="status ${t.status==='succeeded'?'green':t.status==='failed'?'red':''}">${t.status==='succeeded'?'成功':t.status==='pending'?'进行中':'已取消'}</span></td><td>${t.n}</td><td>${qLabels[t.quality]||t.quality}</td><td>${t.cost}</td><td>${fmt(t.at)}</td></tr>`).join('')||'<tr><td colspan="7">暂无任务</td></tr>'}</tbody></table></div>`}
function adminTasks(){return `<div class="page-heading"><div><h2>生图任务</h2><span class="muted small">观察队列、消耗与结果状态</span></div></div><div class="card">${renderTasksTable(state.tasks)}</div>`}
function adminSettings(){const s=state.settings;return `<div class="page-heading"><div><h2>系统设置</h2><span class="muted small">站点基础配置、用户注册及生成限制</span></div></div><div class="card"><form data-form="system" class="section-stack"><h3>站点与注册</h3><div class="settings-grid"><label class="field">站点名称<input name="siteName" value="${safe(s.siteName)}"></label><label class="field">开放注册<select name="registration"><option value="true" ${s.registration?'selected':''}>开启</option><option value="false" ${!s.registration?'selected':''}>关闭</option></select></label><label class="field">注册邮箱验证<select name="verification"><option value="true" ${s.verification?'selected':''}>开启（正式版需 SMTP）</option><option value="false" ${!s.verification?'selected':''}>关闭</option></select></label></div><div class="divider"></div><h3>聊天与生图</h3><div class="settings-grid"><label class="field">单用户每日聊天限额（0 不限）<input name="chatLimit" type="number" min="0" value="${s.chatLimit}"></label><label class="field">一次最多生成张数<input name="maxN" type="number" min="1" max="4" value="${s.maxN}"></label><label class="field">最多上传参考图<input name="maxRefs" type="number" min="1" max="8" value="${s.maxRefs}"></label></div><label class="field">站点公告<textarea name="announcement" rows="3" placeholder="可选，显示在客户端顶部">${safe(s.announcement)}</textarea></label><div class="flex"><button class="btn primary" type="submit">保存设置</button><span class="small muted">正式版需要权限校验、数据库持久化及审计日志</span></div></form></div>`}
function adminAudit(){return `<div class="page-heading"><div><h2>审计日志</h2><span class="muted small">记录管理端对演示数据的变更</span></div></div><div class="card"><div class="table-scroll"><table class="data-table"><thead><tr><th>时间</th><th>动作</th><th>对象</th><th>说明</th></tr></thead><tbody>${state.audit.map(x=>`<tr><td>${fmt(x.at)}</td><td>${safe(x.action)}</td><td>${safe(x.target)}</td><td>${safe(x.detail)}</td></tr>`).join('')}</tbody></table></div></div>`}

function loginShell(){const reg=ui.loginMode==='register';return `<div class="view page login-screen"><div class="login-banner"><div class="brand-row"><span class="logo">${ico('spark')}</span><span class="brand" style="font-size:24px">Lumi</span></div><div><h1>让每一个想法<br>都有无限可能。</h1><p>从一句对话，到一幅画面。<br>让创意自然发生。</p></div><span class="small">Lumi · 智能对话与图像创作</span></div><div class="login-panel"><form class="login-form" data-form="login"><div class="flex" style="margin-bottom:9px"><span class="logo">${ico('spark')}</span><b class="brand">Lumi</b></div><h2>${reg?'创建你的账号':'欢迎回来'}</h2><div class="muted">${reg?'加入 Lumi，开启创意探索之旅。':'登录后继续你的对话和创作。'}</div><div class="login-switch"><button type="button" class="${!reg?'active':''}" data-action="login-tab" data-value="login">登录</button><button type="button" class="${reg?'active':''}" data-action="login-tab" data-value="register">注册</button></div>${reg?`<label class="field">昵称<input name="name" placeholder="怎么称呼你？" required></label>`:''}<label class="field">邮箱地址<input name="email" type="email" placeholder="you@example.com" required value="${reg?'':'xiaolin@example.com'}"></label><label class="field">密码<input name="password" type="password" placeholder="至少 8 位，包含字母和数字" required minlength="8" value="${reg?'':'demo12345'}"></label>${reg?`<label class="checkbox-row"><input name="agree" type="checkbox" required>我已阅读并同意用户协议与隐私政策（演示）</label>`:''}<button class="btn primary" type="submit">${reg?'模拟注册':'进入 Lumi'} ${ico('send','mini-icon')}</button><div class="sample-note">${reg?'注册会在当前浏览器模拟创建个人资料和注册送积分，不会发送邮件或创建真实账号。':'无需真实账号。演示邮箱和密码已经填写；登录仅切换本地界面，并非身份校验。'}</div><div class="muted tiny" style="text-align:center">独立 HTML 交互原型 · 不接入线上服务</div></form></div></div>`}
function render(){resetDay();document.documentElement.dataset.theme=state.theme;document.title=(state.settings.siteName||'Lumi')+' · 交互原型';if(!state.signedIn&&ui.screen!=='login')ui.screen='login';const app=$('#app');if(!app)return;app.innerHTML=ui.screen==='login'?loginShell():ui.screen==='me'?profileShell():ui.screen==='admin'?adminShell():workShell();if(ui.screen==='work'&&activeConv()?.messages?.length){const sc=$('#message-scroll');if(sc)sc.scrollTop=sc.scrollHeight}}
function createConv(mode){return{id:'c_'+rand(),mode,title:mode==='chat'?'新对话':'新创作',created:now(),pinned:false,messages:[]}}
function openConv(id){const c=conv(id);if(!c)return;state.mode=c.mode;state.selected[c.mode]=id;ui.pendingRefs=[];ui.searchOpen=false;persist();nav(c.mode+'/'+id)}
function newConversation(mode=state.mode){state.mode=mode;state.selected[mode]=null;ui.pendingRefs=[];ui.mobileSide=false;state.drafts[mode]='';persist();nav(mode)}
function makeChatReply(text){if(/积分|事务|并发/.test(text))return '要保证安全，可以采用三个约束：\n\n**1. 同一事务内锁定账户行。** 使用 `SELECT ... FOR UPDATE` 防止并发超扣。\n\n**2. 每笔变动写入流水。** 使用唯一的 `idempotency_key` 避免重复扣费。\n\n**3. 出错时整体回滚。** 更新余额和写流水不能分离。\n\n以上是原型模拟回答，正式版由聊天模型实时生成。';if(/代码|go|python|java|接口/i.test(text))return '建议先明确输入、输出与错误处理，然后拆成三层：Handler 负责校验，Service 负责业务逻辑，Repository 负责持久化。\n\n核心操作应可重复测试，并考虑并发、超时、幂等与可观测性。\n\n（演示回复，并非模型真实输出）';return `关于“${text.slice(0,42)}${text.length>42?'…':''}”，可以从目标、限制条件和实施步骤三方面入手。\n\n**建议：**先确认最重要的结果，再按优先级列出方案，最后给每一步明确的验收标准。\n\n这是前端交互原型的模拟回复；连接 chatgpt2api 后才会产生真实模型答案。`}
function ensureConv(){let c=activeConv();if(!c){c=createConv(state.mode);state.conversations.unshift(c);state.selected[state.mode]=c.id}return c}
function sendMessage(){if(ui.activeStream){showToast('请先等待当前演示回复完成，或点击停止。');return}const input=$('#prompt');const text=(input?.value||state.drafts[state.mode]||'').trim();if(!text){showToast('请先输入内容');return}if(text.length>6000){showToast('原型演示最多输入 6000 个字符');return}if(state.mode==='create'&&creditTotal()<imageCost()){showToast('积分不足，请先兑换');return}
const mode=state.mode,c=ensureConv(),params={...state.imagePrefs,size:SIZES[state.imagePrefs.ratio],n:state.imagePrefs.n,edit:!!ui.pendingRefs.length};const refIds=ui.pendingRefs.map(x=>x.imageId).filter(Boolean);c.messages.push({id:rand(),role:'user',text,...(mode==='create'?{params,refs:refIds}:{})});if(c.messages.length===1)c.title=text.slice(0,22)+(text.length>22?'…':'');c.created=now();state.drafts[mode]='';ui.paramOpen=false;ui.attachOpen=false;
if(mode==='chat'){const msg={id:rand(),role:'assistant',text:'',status:'streaming'};c.messages.push(msg);persist();ui.activeStream={type:'chat',messageId:msg.id,convId:c.id};render();navSilent(mode,c.id);const response=makeChatReply(text);let index=0;const timer=setInterval(()=>{if(!ui.activeStream||ui.activeStream.messageId!==msg.id){clearInterval(timer);return}index=Math.min(response.length,index+3);msg.text=response.slice(0,index);const container=$('.assistant-content', $$('.message-row.assistant').at(-1));if(container)container.innerHTML=renderMessageText(msg.text);const sc=$('#message-scroll');if(sc&&sc.scrollHeight-sc.scrollTop-sc.clientHeight<200)sc.scrollTop=sc.scrollHeight;if(index===response.length){clearInterval(timer);msg.status='done';ui.activeStream=null;persist();render()}},32);ui.activeStream.timer=timer;
}else{const cost=imageCost(),split=charge(cost,text.slice(0,60));if(!split)return;const taskId='task_'+rand(),msg={id:rand(),role:'assistant',imageIds:[],cost,status:'pending',n:params.n,taskId};c.messages.push(msg);const task={id:taskId,user:state.user.name,status:'pending',quality:params.quality,n:params.n,cost,split,at:now()};state.tasks.unshift(task);ui.pendingRefs=[];persist();ui.activeStream={type:'image',messageId:msg.id,convId:c.id,taskId,split};render();navSilent(mode,c.id);const timer=setTimeout(()=>{if(msg.status!=='pending')return;const variant=seededVariant(text);const arr=Array.from({length:params.n},(_,i)=>({id:'a_'+rand(),prompt:text,quality:params.quality,ratio:params.ratio,size:params.size,conversationId:c.id,created:now(),variant,seed:Math.floor(Math.random()*15)+i}));state.images.unshift(...arr);msg.imageIds=arr.map(x=>x.id);msg.status='succeeded';task.status='succeeded';ui.activeStream=null;syncUser();persist();render();showToast(`演示生成完成：${arr.length} 张图，消耗 ${cost} 积分`)},2200);ui.activeStream.timer=timer}}

function handleForm(form){const f=new FormData(form),type=form.dataset.form,get=k=>String(f.get(k)??'').trim(),num=k=>Number(f.get(k));
if(type==='login'){const email=get('email'),pwd=get('password'),register=ui.loginMode==='register';if(register&&!state.settings.registration){showToast('管理员已关闭注册');return}if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)||pwd.length<8){showToast('请填写有效邮箱和至少 8 位密码');return}if(register){if(state.demoProfiles?.[state.demoRole])state.demoProfiles[state.demoRole]=captureDemoProfile();state.demoRole='user';state.user={id:'u_'+rand(),name:get('name')||'新用户',email,role:'user',joined:today()};state.accounts={daily:state.settings.daily,permanent:state.settings.signup,lastReset:today()};state.ledger=[];if(state.settings.signup)ledger('signup_bonus',state.settings.signup,'permanent','注册赠送');if(state.settings.daily)ledger('daily_grant',state.settings.daily,'daily','每日赠送');state.users.push({id:state.user.id,name:state.user.name,email,role:'user',status:'active',daily:state.accounts.daily,permanent:state.accounts.permanent,images:0,lastLogin:'刚刚'});state.conversations=[];state.images=[];state.selected={chat:null,create:null};audit('模拟注册','user',email)}state.signedIn=true;persist();nav('chat');showToast(register?'模拟注册完成':'欢迎使用 Lumi 演示原型');return}

function toggleUserMenu(){let root=$('#user-menu-slot');if(!root)return;const shown=root.childElementCount>0;root.innerHTML=shown?'':`<div class="popover utility-pop user-popover" role="menu" aria-label="用户菜单"><button class="menu-option" data-action="nav-credits">${ico('coins')} 我的积分</button><button class="menu-option" data-action="nav-gallery">${ico('grid')} 生图图库</button><button class="menu-option" data-action="settings-modal">${ico('settings')} 偏好设置</button>${state.user.role==='admin'?`<button class="menu-option" data-action="nav-admin">${ico('shield')} 管理后台</button>`:''}<div class="menu-separator"></div><div class="eyebrow" style="padding:7px 12px 3px">演示身份 · 仅原型</div><button class="menu-option" data-action="switch-demo" data-value="${state.demoRole==='admin'?'user':'admin'}">${ico('users')} 切换为${state.demoRole==='admin'?'普通用户':'超级管理员'}</button><div class="menu-separator"></div><button class="menu-option danger" data-action="logout">${ico('logout')} 退出演示</button></div>`}
function onAction(a,el,event){const id=el.dataset.id,val=el.dataset.value;switch(a){case'mode':switchMode(el.dataset.mode);break;case'toggle-side':ui.mobileSide=!ui.mobileSide;render();break;case'close-side':ui.mobileSide=false;ui.adminSide=false;render();break;case'admin-mobile':ui.adminSide=!ui.adminSide;render();break;case'new':newConversation();break;case'new-create':newConversation('create');break;case'back-work':nav(state.mode+(state.selected[state.mode]?'/'+state.selected[state.mode]:''));break;case'open-search':searchModal();break;case'nav-gallery':ui.meTab='images';nav('me/images');break;case'nav-credits':ui.meTab='credits';nav('me/credits');break;case'nav-admin':nav('admin/overview');break;case'switch-demo':switchDemoRole(val);break;case'user-menu':toggleUserMenu();break;case'theme':state.theme=state.theme==='dark'?'light':'dark';persist();render();break;case'logout':state.signedIn=false;persist();nav('login');break;case'login-tab':ui.loginMode=val;render();break;case'open-conv':if($('#modal')?.open)$('#modal').close();openConv(id);break;case'conv-menu':{const c=conv(id);if(!c)return;openModal('会话操作',`<input name="id" value="${id}" type="hidden"><p class="muted small">${safe(c.title)}</p><button class="menu-option" type="button" data-action="rename-conv" data-id="${id}">${ico('edit')} 重命名</button><button class="menu-option" type="button" data-action="pin-conv" data-id="${id}">${ico('spark')} ${c.pinned?'取消置顶':'置顶会话'}</button><button class="menu-option danger" type="button" data-action="delete-conv" data-id="${id}">${ico('trash')} 删除会话</button>`,'noop','关闭');break}case'rename-conv':$('#modal')?.close();openRename(id);break;case'pin-conv':{const c=conv(id);if(c){c.pinned=!c.pinned;persist()}$('#modal')?.close();render();break}case'delete-conv':{if(!confirmAction('确认删除这条会话？关联的已生成图片仍保留在图库。'))return;state.conversations=state.conversations.filter(x=>x.id!==id);for(const m of ['chat','create'])if(state.selected[m]===id)state.selected[m]=null;persist();$('#modal')?.close();nav(state.mode);showToast('会话已删除');break}case'clear-chats':{if(!confirmAction('确认清空全部聊天会话？'))return;state.conversations=state.conversations.filter(x=>x.mode!=='chat');state.selected.chat=null;persist();render();showToast('已清空聊天会话');break}case'model-toggle':ui.modelOpen=!ui.modelOpen;ui.paramOpen=false;render();break;case'model-set':state.models[state.mode]=id;ui.modelOpen=false;persist();render();break;case'param-toggle':ui.paramOpen=!ui.paramOpen;ui.modelOpen=false;ui.attachOpen=false;render();break;case'param-close':ui.paramOpen=false;render();break;case'param':state.imagePrefs[el.dataset.key]=el.dataset.key==='n'?Number(val):val;persist();render();break;case'attach-toggle':ui.attachOpen=!ui.attachOpen;ui.paramOpen=false;render();break;case'upload':ui.attachOpen=false;$('#upload')?.click();break;case'picker':ui.attachOpen=false;pickerModal();break;case'pick-ref':{if(ui.pendingRefs.length>=state.settings.maxRefs){showToast('已达到参考图上限');return}if(ui.pendingRefs.some(x=>x.imageId===id)){showToast('图片已在参考列表');return}const img=state.images.find(x=>x.id===id);if(img)ui.pendingRefs.push({imageId:id,url:artURL(img),name:'历史作品'});$('#modal')?.close();render();showToast('参考图已添加');break}case'remove-ref':ui.pendingRefs.splice(Number(el.dataset.index),1);render();break;case'send':sendMessage();break;case'stop':stopJob();break;case'suggest':state.drafts[state.mode]=el.dataset.text;render();$('#prompt')?.focus();break;case'copy-msg':{const m=activeConv()?.messages[Number(el.dataset.index)];if(m)copyText(m.text||'');break}case'edit-user-msg':{const c=activeConv(),msg=c?.messages[Number(el.dataset.index)];if(!msg)return;state.drafts[state.mode]=msg.text;c.messages=c.messages.slice(0,Number(el.dataset.index));persist();render();$('#prompt')?.focus();showToast('已恢复消息内容，修改后重新发送');break}case'regen':{const c=activeConv(),index=Number(el.dataset.index),before=c?.messages.slice(0,index).reverse().find(x=>x.role==='user');if(!before)return;state.drafts[state.mode]=before.text;if(before.params)state.imagePrefs={quality:before.params.quality,ratio:before.params.ratio,n:before.params.n};render();$('#prompt')?.focus();showToast('已填入上次的提示词和参数，确认后发送');break}case'cancel-task':stopJob();break;case'preview':previewImage(id);break;case'preview-close':closePreview();break;case'edit-image':useImageAsRef(id);break;case'download-image':downloadImage(id);showToast('演示 SVG 图已下载');break;case'delete-image':{if(!confirmAction('删除这张图片？该操作只影响浏览器中的演示作品。'))return;state.images=state.images.filter(x=>x.id!==id);state.conversations.forEach(c=>c.messages.forEach(m=>{if(m.imageIds)m.imageIds=m.imageIds.filter(x=>x!==id)}));persist();closePreview();render();showToast('作品已删除');break}case'me-tab':ui.meTab=val;nav('me/'+val);break;case'profile-edit':case'settings-modal':settingsModal();break;case'reset-demo':{if(!confirmAction('将清空本浏览器保存的所有演示操作并恢复原始数据。确定继续？'))return;localStorage.removeItem(STORAGE);state=seed();ensureDemoIdentity();ui.pendingRefs=[];persist();nav('chat');showToast('已恢复初始演示数据');break}case'admin-tab':ui.adminTab=val;nav('admin/'+val);break;case'admin-new-user':adminNewUser();break;case'admin-edit-user':adminEditUser(id);break;case'admin-adjust':adminAdjust(id);break;case'admin-toggle-user':{const u=state.users.find(x=>x.id===id);if(!u)return;if(u.id===state.user.id){showToast('不能禁用当前演示管理员');return}u.status=u.status==='active'?'disabled':'active';audit('更改用户状态','user',`${u.email}: ${u.status}`);persist();render();break}case'copy-code':copyText(state.codes[Number(id)]?.code||'');break;case'toggle-code':{const c=state.codes[Number(id)];if(!c)return;c.status=c.status==='active'?'disabled':'active';audit('变更兑换码状态','code',c.code+' '+c.status);persist();render();break}case'export-codes':{const content='兑换码,积分,状态,已用,可用次数,批次\n'+state.codes.map(c=>[c.code,c.credits,c.status,c.used,c.maxUses,c.batch].join(',')).join('\n'),blob=new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='lumi-demo-redeem-codes.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),300);break}case'upstream-info':openModal('上游接入说明',`<p>此文件是静态 HTML，不保存 API Key，也不直接请求真实上游。</p><p class="muted small">Codex 实现后，在管理后台完成：配置 Base URL → 安全保存 API Key → 测试 /v1/models → 同步模型 → 将平台模型映射到渠道与真实模型。接口契约以实际部署的 chatgpt2api 实测结果为准。</p>`,'noop','知道了');break;case'modal-close':$('#modal')?.close();break;default:break}}
// Event delegation, safe rendering; native dialogs are used for accessibility.
document.addEventListener('click',event=>{if($('#user-menu-slot')?.childElementCount&&!event.target.closest('#user-menu-slot,.user-trigger')){$('#user-menu-slot').innerHTML=''}const el=event.target.closest('[data-action]');if(el){event.preventDefault();onAction(el.dataset.action,el,event);return}if(ui.modelOpen&&!event.target.closest('.model-pop,.model-select')){ui.modelOpen=false;render()}if(ui.paramOpen&&!event.target.closest('.param-open,.param-pop')){ui.paramOpen=false;render()}});
document.addEventListener('submit',event=>{const f=event.target.closest('form[data-form]');if(!f)return;event.preventDefault();if(f.dataset.form==='noop'){$('#modal')?.close();return}handleForm(f)});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='prompt'){state.drafts[state.mode]=el.value;el.style.height='auto';el.style.height=Math.min(el.scrollHeight,180)+'px';return}if(el.id==='gallery-search'){ui.gallerySearch=el.value;const pos=el.selectionStart;render();const input=$('#gallery-search');if(input){input.focus();input.setSelectionRange(pos,pos)}return}if(el.id==='admin-search'){ui.adminSearch=el.value;const pos=el.selectionStart;render();const input=$('#admin-search');if(input){input.focus();input.setSelectionRange(pos,pos)}return}if(el.name==='search'){const results=$('#search-results');if(results)results.innerHTML=searchResults(el.value)}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='gallery-filter'){ui.galleryFilter=el.value;render()}if(el.id==='admin-status'){ui.adminStatus=el.value;render()}});
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();searchModal();return}if(event.key==='Escape'){ui.modelOpen=false;ui.paramOpen=false;ui.attachOpen=false;ui.mobileSide=false;ui.adminSide=false;if($('#modal')?.open||$('#preview')?.open)return;render();return}if(event.key==='Enter'&&!event.shiftKey&&event.target.id==='prompt'&&!event.isComposing){event.preventDefault();sendMessage()}});
$('#upload').addEventListener('change',async event=>{const files=Array.from(event.target.files||[]);for(const file of files){if(ui.pendingRefs.length>=state.settings.maxRefs){showToast('参考图上限 '+state.settings.maxRefs+' 张');break}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){showToast('仅支持 JPEG、PNG、WebP');continue}if(file.size>10*1024*1024){showToast('单图不能超过 10MB');continue}const data=await new Promise(res=>{const reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=()=>res(null);reader.readAsDataURL(file)});if(data)ui.pendingRefs.push({url:data,name:file.name})}event.target.value='';if(state.mode!=='create'){state.mode='create';nav('create'+(state.selected.create?'/'+state.selected.create:''))}else render();showToast('参考图已添加（浏览器内演示，不会上传服务器）')});
window.addEventListener('hashchange',routeFromHash);
// Recover interrupted simulated tasks on reload so credits don't remain deducted forever.
(function recover(){let changed=false;for(const t of state.tasks.filter(x=>x.status==='pending')){t.status='failed';const c=state.conversations.find(c=>c.messages.some(m=>m.taskId===t.id));const msg=c?.messages.find(m=>m.taskId===t.id);if(msg&&msg.status==='pending'){msg.status='failed';msg.cost=0}refund(t.split||{daily:0,permanent:t.cost},'原型页面刷新，取消任务退款');t.cost=0;changed=true}if(changed)persist()})();
if(!location.hash)history.replaceState(null,'','#/chat/c1');routeFromHash();
</script>
