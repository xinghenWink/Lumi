version: '2'
run:
  timeout: 5m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
  exclusions:
    rules:
      # Configuration tests intentionally contain fake credential markers.
      - path: _test\.go
        linters: [gosec]
        text: G101
formatters:
  enable:
    - gofmt
