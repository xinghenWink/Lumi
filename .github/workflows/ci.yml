name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: ci-e2e-only
          POSTGRES_DB: lumi
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lumi -d lumi" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://lumi:ci-e2e-only@127.0.0.1:5432/lumi?sslmode=disable
      E2E_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: make install
      - run: make lint test
      - name: Scan production dependencies
        run: |
          cd backend && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          cd .. && pnpm audit --prod --audit-level high --registry https://registry.npmjs.org
      - name: Check generated contracts
        run: |
          make sqlc api
          git diff --exit-code -- backend/internal/platform/db/query frontend/src/api/schema.d.ts
      - run: make test-integration
      - run: make build
      - name: Install Chrome and its system dependencies
        run: |
          # Keep signed Ubuntu packages while avoiding the slow HTTP Azure mirror.
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          pnpm --filter @lumi/frontend exec playwright install --with-deps chrome
      - run: pnpm test:e2e
      - name: Install pinned k6
        run: |
          curl --fail --location --silent --show-error https://github.com/grafana/k6/releases/download/v1.3.0/k6-v1.3.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/k6.tar.gz"
          printf '84d26fc1f7bc03e02f2e016b3b1b20c032e05dfe461fca82de4e3a6ebe72ddbd  %s\n' "$RUNNER_TEMP/k6.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/k6.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/k6-v1.3.0-linux-amd64" >> "$GITHUB_PATH"
      - name: Prepare isolated capacity dependencies
        run: |
          lumi_load_password=$(openssl rand -hex 24)
          printf '::add-mask::%s\n' "$lumi_load_password"
          # Match the target rehearsal's direct loopback path, without host port forwarding.
          docker run -d --name lumi-capacity-postgres --network host \
            -e POSTGRES_USER=lumi -e POSTGRES_PASSWORD="$lumi_load_password" -e POSTGRES_DB=lumi_m7_load \
            postgres:16-alpine postgres -c listen_addresses=127.0.0.1 -p 15432
          docker run -d --name lumi-capacity-redis --network host redis:7-alpine \
            redis-server --bind 127.0.0.1 --port 16379 --requirepass "$lumi_load_password"
          for attempt in $(seq 1 60); do
            if docker exec lumi-capacity-postgres pg_isready -h 127.0.0.1 -p 15432 -U lumi -d lumi_m7_load \
              && docker exec lumi-capacity-redis redis-cli -p 16379 -a "$lumi_load_password" ping 2>/dev/null | grep -qx PONG; then
              break
            fi
            sleep 1
          done
          docker exec lumi-capacity-postgres pg_isready -h 127.0.0.1 -p 15432 -U lumi -d lumi_m7_load
          docker exec lumi-capacity-redis redis-cli -p 16379 -a "$lumi_load_password" ping 2>/dev/null | grep -qx PONG
          printf 'E2E_DATABASE_URL=postgres://lumi:%s@127.0.0.1:15432/lumi_m7_load?sslmode=disable\nE2E_REDIS_URL=redis://:%s@127.0.0.1:16379/0\n' \
            "$lumi_load_password" "$lumi_load_password" >> "$GITHUB_ENV"
      - name: Measure 100 distinct users with a local upstream
        env:
          GOMAXPROCS: '2'
          LUMI_DIAGNOSTICS: '1'
        run: |
          node scripts/performance/run.mjs
      - name: Stop isolated capacity dependencies
        if: always()
        run: docker rm -f lumi-capacity-postgres lumi-capacity-redis 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: k6-results
          path: |
            .tools/m7-load/summary.json
            .tools/m7-load/environment.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore

  react-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: ci-e2e-only
          POSTGRES_DB: lumi
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U lumi -d lumi" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://lumi:ci-e2e-only@127.0.0.1:5432/lumi?sslmode=disable
      E2E_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:react
      - name: Install Chrome and system dependencies
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          pnpm --filter @lumi/frontend exec playwright install --with-deps chrome
      - run: pnpm test:e2e:react
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: react-playwright-results
          path: frontend/test-results/e2e
          if-no-files-found: ignore

  container:
    needs: [quality, react-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Build the application image
        run: docker build --build-arg VERSION=ci --build-arg COMMIT="$GITHUB_SHA" -t lumi:ci .
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chrome for production embed acceptance
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          pnpm --filter @lumi/frontend exec playwright install --with-deps chrome
      - name: Verify production dependency readiness probes
        run: node --test scripts/react-embed-readiness.test.mjs
      - name: Verify the React production Docker embed
        run: node scripts/react-embed-smoke.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: react-container-embed-results
          include-hidden-files: true
          path: |
            frontend/test-results/embed
            .tools/react-embed/*/report.json
            .tools/react-embed/*/diagnostics.json
          if-no-files-found: ignore
      - name: Generate ephemeral container credentials
        shell: bash
        run: |
          lumi_ci_jwt=$(openssl rand -hex 32)
          lumi_ci_key=$(openssl rand -base64 32)
          lumi_ci_admin="$(openssl rand -hex 24)Aa1"
          for lumi_ci_secret in "$lumi_ci_jwt" "$lumi_ci_key" "$lumi_ci_admin"; do
            printf '::add-mask::%s\n' "$lumi_ci_secret"
          done
          printf 'JWT_SECRET=%s\nENCRYPTION_KEY=%s\nADMIN_PASSWORD=%s\n' "$lumi_ci_jwt" "$lumi_ci_key" "$lumi_ci_admin" >> "$GITHUB_ENV"
      - name: Verify the full compose stack
        env:
          LUMI_IMAGE: lumi
          LUMI_VERSION: ci
          POSTGRES_PASSWORD: ci-database-only
          REDIS_PASSWORD: ci-cache-only
          ADMIN_EMAIL: admin@lumi.test
        run: |
          cp deploy/.env.example deploy/.env
          mkdir -p deploy/data/app
          sudo chown 10001:10001 deploy/data/app
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:8080/readyz
          curl --fail --silent http://127.0.0.1:8080/api/version
          curl --fail --silent http://127.0.0.1:8080/ | grep -q '<div id="app">'
      - name: Stop initial stack before isolated deployment rehearsal
        env:
          POSTGRES_PASSWORD: ci-database-only
          REDIS_PASSWORD: ci-cache-only
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml down --volumes
      - name: Build the previous milestone for rollback verification
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          git archive e9f87b2 | tar -x -C "$RUNNER_TEMP/previous"
          docker build --build-arg VERSION=previous -t lumi:previous "$RUNNER_TEMP/previous"
      - name: Rehearse installation, upgrade, rollback and backup restore
        run: sudo env LUMI_CURRENT_IMAGE=lumi:ci LUMI_PREVIOUS_IMAGE=lumi:previous bash scripts/deploy-smoke.sh
      - name: Print container diagnostics
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-database-only
          REDIS_PASSWORD: ci-cache-only
        run: |
          if test -f deploy/.env; then
            docker compose --env-file deploy/.env -f deploy/docker-compose.yml logs --no-color
          fi
      - name: Stop containers
        if: always()
        env:
          POSTGRES_PASSWORD: ci-database-only
          REDIS_PASSWORD: ci-cache-only
        run: |
          if test -f deploy/.env; then
            docker compose --env-file deploy/.env -f deploy/docker-compose.yml down --volumes
          fi
