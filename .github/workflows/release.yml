name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare build metadata
        id: build
        shell: bash
        run: |
          printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          printf 'time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ steps.build.outputs.image }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7.4.0
        id: publish
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.time }}
  verify-published:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
      EXPECTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Verify the published manifest and native image
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > "$RUNNER_TEMP/manifest.json"
          for architecture in amd64 arm64; do
            jq --exit-status --arg architecture "$architecture" \
              '.manifests | any(.platform.os == "linux" and .platform.architecture == $architecture)' \
              "$RUNNER_TEMP/manifest.json"
          done
          docker pull --platform "linux/$EXPECTED_ARCHITECTURE" "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{.Architecture}}')" = "$EXPECTED_ARCHITECTURE"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{.Config.User}}')" = '10001:10001'
      - name: Prepare isolated runtime credentials
        run: |
          for key in POSTGRES_PASSWORD REDIS_PASSWORD JWT_SECRET ENCRYPTION_KEY ADMIN_PASSWORD; do
            if test "$key" = ENCRYPTION_KEY; then
              value="$(openssl rand -base64 32 | tr -d '\n')"
            else
              value="$(openssl rand -hex 32)Aa1"
            fi
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
          cp deploy/.env.example deploy/.env
          printf 'services:\n  app:\n    image: %s@%s\n    platform: linux/%s\n' \
            "$IMAGE" "$DIGEST" "$EXPECTED_ARCHITECTURE" > "$RUNNER_TEMP/published-image.yml"
      - name: Verify the published production stack
        env:
          ADMIN_EMAIL: acceptance@example.com
        run: |
          mkdir -p deploy/data/app
          sudo chown 10001:10001 deploy/data/app
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml -f "$RUNNER_TEMP/published-image.yml" \
            up -d --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          curl --fail --silent --show-error http://127.0.0.1:8080/api/version | \
            jq --exit-status --arg version "$EXPECTED_VERSION" --arg commit "$GITHUB_SHA" \
              '.version == $version and .commit == $commit'
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q '<div id="app">'
          printf 'Verified %s@%s on linux/%s\n' "$IMAGE" "$DIGEST" "$EXPECTED_ARCHITECTURE" >> "$GITHUB_STEP_SUMMARY"
      - name: Print published container diagnostics
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/published-image.yml"; then
            docker compose --env-file deploy/.env -f deploy/docker-compose.yml -f "$RUNNER_TEMP/published-image.yml" logs --no-color
          fi
      - name: Stop published containers
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/published-image.yml"; then
            docker compose --env-file deploy/.env -f deploy/docker-compose.yml -f "$RUNNER_TEMP/published-image.yml" down --volumes
          fi

  release:
    needs: [publish, verify-published]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --generate-notes --verify-tag
          fi
